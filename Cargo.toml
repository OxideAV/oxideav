[package]
name = "oxideav"
# Standalone-friendly literals — the sibling repo's CI doesn't have a
# workspace root to inherit from. Workspace builds still work because
# Cargo prefers the package-level values when both are defined.
version = "0.0.4"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav"
authors = ["Mark Karpeles"]
description = "Thin facade over oxideav-core — re-exports + future high-level decode/encode invoke API. Pull in oxideav-format-all (or individual sibling crates) alongside this to populate the codec/container/filter/source registries."

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav"
keywords = ["multimedia", "audio", "video", "codec", "transcoding"]
categories = ["multimedia", "multimedia::encoding"]

[dependencies]
# This crate is intentionally NOT an aggregator — adding a new sibling
# does not touch this manifest. The umbrella delegates registry walking
# to oxideav-core's distributed-slice and exposes the result through a
# 1-line `with_all_features()` wrapper. Consumers depending on
# `oxideav-format-all` (or individual sibling crates) populate the slice
# at link time; this crate just walks it.
oxideav-core = { version = "0.1" }
oxideav-pipeline = { version = "0.1" }
oxideav-source = { version = "0.1" }
log = "0.4"
