[package]
name = "oxideav"
# Standalone-friendly literals — the sibling repo's CI doesn't have a
# workspace root to inherit from. Workspace builds still work because
# Cargo prefers the package-level values when both are defined.
version = "0.0.3"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav"
authors = ["Mark Karpeles"]
description = "Central aggregator crate for oxideav — re-exports and a prebuilt registry"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav"
keywords = ["multimedia", "audio", "video", "codec", "transcoding"]
categories = ["multimedia", "multimedia::encoding"]

[features]
default = [
    "basic",
    "ogg",
    "vorbis",
    "opus",
    "flac",
    "mkv",
    "webm",
    "mp4",
    "avi",
    "flv",
    "iff",
    "amiga_mod",
    "s3m",
    "mp1",
    "mp2",
    "mp3",
    "mjpeg",
    "mpeg1video",
    "mpeg2video",
    "mpeg4video",
    "msmpeg4",
    "theora",
    "aac",
    "ac3",
    "ac4",
    "celt",
    "g711",
    "g722",
    "adpcm",
    "g7231",
    "g728",
    "g729",
    "ilbc",
    "gsm",
    "speex",
    "vp9",
    "h265",
    "h266",
    "h264",
    "av1",
    "h263",
    "h261",
    "vp8",
    "vp6",
    "webp",
    "gif",
    "png",
    "pbm",
    "svg",
    "amv",
    "subtitle",
    "sub_image",
    "ass",
    "ffv1",
    "dirac",
    "prores",
    "audio_filter",
    "image_filter",
    "pixfmt",
    "jpegxl",
    "jpeg2000",
    "avif",
    "generator",
    "raster",
]
basic = ["dep:oxideav-basic"]
ogg = ["dep:oxideav-ogg"]
vorbis = ["dep:oxideav-vorbis"]
opus = ["dep:oxideav-opus"]
flac = ["dep:oxideav-flac"]
mkv = ["dep:oxideav-mkv"]
# WebM rides the oxideav-mkv crate — the demuxer is shared and the muxer
# exposes a DocType="webm" mode with a VP8/VP9/AV1/Vorbis/Opus whitelist.
webm = ["mkv"]
mp4 = ["dep:oxideav-mp4"]
avi = ["dep:oxideav-avi"]
flv = ["dep:oxideav-flv"]
iff = ["dep:oxideav-iff"]
amiga_mod = ["dep:oxideav-mod"]
s3m = ["dep:oxideav-s3m"]
mp1 = ["dep:oxideav-mp1"]
mp2 = ["dep:oxideav-mp2"]
mp3 = ["dep:oxideav-mp3"]
mjpeg = ["dep:oxideav-mjpeg"]
mpeg1video = ["dep:oxideav-mpeg12video"]
# MPEG-2 video (H.262) is served by the same crate (`oxideav-mpeg12video`)
# as MPEG-1 video; this feature is a cosmetic alias so downstream users can
# request `mpeg2video` without caring about the internal crate layout.
mpeg2video = ["mpeg1video"]
mpeg4video = ["dep:oxideav-mpeg4video"]
msmpeg4 = ["dep:oxideav-msmpeg4"]
theora = ["dep:oxideav-theora"]
aac = ["dep:oxideav-aac"]
ac3 = ["dep:oxideav-ac3"]
ac4 = ["dep:oxideav-ac4"]
celt = ["dep:oxideav-celt"]
g711 = ["dep:oxideav-g711"]
g722 = ["dep:oxideav-g722"]
adpcm = ["dep:oxideav-adpcm"]
g7231 = ["dep:oxideav-g7231"]
g728 = ["dep:oxideav-g728"]
g729 = ["dep:oxideav-g729"]
ilbc = ["dep:oxideav-ilbc"]
gsm = ["dep:oxideav-gsm"]
speex = ["dep:oxideav-speex"]
vp9 = ["dep:oxideav-vp9"]
h265 = ["dep:oxideav-h265"]
h266 = ["dep:oxideav-h266"]
h264 = ["dep:oxideav-h264"]
av1 = ["dep:oxideav-av1"]
h263 = ["dep:oxideav-h263"]
h261 = ["dep:oxideav-h261"]
vp8 = ["dep:oxideav-vp8"]
vp6 = ["dep:oxideav-vp6"]
webp = ["dep:oxideav-webp"]
gif = ["dep:oxideav-gif"]
png = ["dep:oxideav-png"]
pbm = ["dep:oxideav-pbm"]
svg = ["dep:oxideav-svg"]
# Netpbm convenience aliases — PBM/PGM/PPM/PNM/PAM all live in the
# same self-contained crate (the magic byte at offset 1 disambiguates),
# so any of these feature names pulls in the one crate.
pgm = ["pbm"]
ppm = ["pbm"]
pnm = ["pbm"]
pam = ["pbm"]
amv = ["dep:oxideav-amv"]
subtitle = ["dep:oxideav-subtitle"]
sub_image = ["dep:oxideav-sub-image"]
ass = ["dep:oxideav-ass"]
ffv1 = ["dep:oxideav-ffv1"]
dirac = ["dep:oxideav-dirac"]
prores = ["dep:oxideav-prores"]
jpegxl = ["dep:oxideav-jpegxl"]
# `jxl` is an alias — the JPEG XL spec uses both names interchangeably.
jxl = ["jpegxl"]
jpeg2000 = ["dep:oxideav-jpeg2000"]
# `jp2` is the ISO BMFF-boxed flavour of JPEG 2000; it rides the same crate.
jp2 = ["jpeg2000"]
avif = ["dep:oxideav-avif"]
audio_filter = ["dep:oxideav-audio-filter"]
image_filter = ["dep:oxideav-image-filter"]
pixfmt = ["dep:oxideav-pixfmt"]
# HTTP/HTTPS source driver. Off by default — opt in to link ureq + rustls.
http = ["dep:oxideav-http"]
# Synthetic media generator (`generate://` URI scheme + zero-input filters).
# Default-on so `convert xc:red` etc. work out of the box.
generator = ["dep:oxideav-generator"]
# Vector→raster rendering kernel — turns a VectorFrame (SVG/PDF
# scene graph) into a packed Rgba VideoFrame. Default-on because
# downstream consumers (CLI render, player composite) need it as
# the bridge between vector decoders and pixel sinks.
raster = ["dep:oxideav-raster"]
# Time-based scene / composition model. Off by default — experimental
# scaffold (PDF pages, RTMP compositor, NLE timelines).
scene = ["dep:oxideav-scene"]
# PDF writer — vector-stays-vector path. Off by default since PDF is
# rarely a transcoding target; opt in to pull in oxideav-pdf + flate2.
pdf = ["dep:oxideav-pdf"]

[dependencies]
# Codec / container trait + registry types are now in oxideav-core
# directly; the former oxideav-codec / oxideav-container shim crates
# have been archived.
oxideav-core = { version = "0.1" }
oxideav-pipeline = { version = "0.1" }
oxideav-source = { version = "0.1" }
# `with_all_features` emits one `log::debug!` per crate it registers,
# so consumers that install a logger (e.g. the CLI's `--debug`) can
# see startup progress + diagnose hangs. log is a tiny façade with
# no transitive deps; the target call site is a no-op when no logger
# is installed.
log = "0.4"
oxideav-http = { version = "0.0", optional = true  }
oxideav-basic = { version = "0.0", optional = true  }
oxideav-ogg = { version = "0.1", optional = true  }
oxideav-vorbis = { version = "0.0", optional = true  }
oxideav-opus = { version = "0.0", optional = true  }
oxideav-flac = { version = "0.0", optional = true  }
oxideav-mkv = { version = "0.0", optional = true  }
oxideav-mp4 = { version = "0.0", optional = true  }
oxideav-avi = { version = "0.0", optional = true  }
oxideav-flv = { version = "0.0", optional = true  }
oxideav-iff = { version = "0.0", optional = true  }
oxideav-mod = { version = "0.0", optional = true  }
oxideav-s3m = { version = "0.0", optional = true  }
oxideav-mp1 = { version = "0.0", optional = true  }
oxideav-mp2 = { version = "0.0", optional = true  }
oxideav-mp3 = { version = "0.0", optional = true  }
oxideav-mjpeg = { version = "0.1", optional = true  }
oxideav-mpeg12video = { version = "0.0", optional = true  }
oxideav-mpeg4video = { version = "0.1", optional = true  }
oxideav-msmpeg4 = { version = "0.0", optional = true  }
oxideav-theora = { version = "0.0", optional = true  }
oxideav-aac = { version = "0.1", optional = true  }
oxideav-ac3 = { version = "0.0", optional = true  }
oxideav-ac4 = { version = "0.0", optional = true  }
oxideav-celt = { version = "0.1", optional = true  }
oxideav-g711 = { version = "0.0", optional = true  }
oxideav-g722 = { version = "0.0", optional = true  }
oxideav-adpcm = { version = "0.0", optional = true  }
oxideav-g7231 = { version = "0.0", optional = true  }
oxideav-g728 = { version = "0.0", optional = true  }
oxideav-g729 = { version = "0.0", optional = true  }
oxideav-ilbc = { version = "0.0", optional = true  }
oxideav-gsm = { version = "0.0", optional = true  }
oxideav-speex = { version = "0.0", optional = true  }
oxideav-vp9 = { version = "0.0", optional = true  }
oxideav-h265 = { version = "0.0", optional = true  }
oxideav-h266 = { version = "0.0", optional = true  }
oxideav-h264 = { version = "0.1", optional = true  }
oxideav-av1 = { version = "0.1", optional = true  }
oxideav-h263 = { version = "0.0", optional = true  }
oxideav-h261 = { version = "0.0", optional = true  }
oxideav-vp8 = { version = "0.1", optional = true  }
oxideav-vp6 = { version = "0.0", optional = true  }
oxideav-webp = { version = "0.0", optional = true  }
oxideav-gif = { version = "0.0", optional = true  }
oxideav-png = { version = "0.1", optional = true  }
oxideav-pbm = { version = "0.0", optional = true  }
oxideav-svg = { version = "0.1", optional = true  }
oxideav-amv = { version = "0.0", optional = true  }
oxideav-subtitle = { version = "0.1", optional = true  }
oxideav-sub-image = { version = "0.0", optional = true  }
oxideav-ass = { version = "0.0", optional = true  }
oxideav-ffv1 = { version = "0.0", optional = true  }
oxideav-dirac = { version = "0.0", optional = true  }
oxideav-prores = { version = "0.0", optional = true  }
oxideav-jpegxl = { version = "0.0", optional = true  }
oxideav-jpeg2000 = { version = "0.0", optional = true  }
oxideav-avif = { version = "0.0", optional = true  }
